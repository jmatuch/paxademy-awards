display_information:
  name: PAXademy Awards
  description: Nominate fellow PAX for PAXademy Awards
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: PAXademy Awards
    always_online: true
  slash_commands:
    - command: /paxademy-awards
      url: https://paxademy-awards.vercel.app/api/slack
      description: Nominate a PAX, browse history, or change settings
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - channels:read
      - channels:join
      - groups:read
      - users:read
      - reactions:read
settings:
  event_subscriptions:
    request_url: https://paxademy-awards.vercel.app/api/slack
    bot_events:
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
    request_url: https://paxademy-awards.vercel.app/api/slack
    message_menu_options_url: https://paxademy-awards.vercel.app/api/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
